<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D Interactivo — Afirmaciones Diarias | Editorial Menos Ruido</title>
    <meta name="description" content="Hojea en 3D una muestra de las primeras 10 páginas del cuaderno 'Afirmaciones Diarias': portadas, manifiesto, método de 5 minutos y fichas diarias.">
    <!-- Estado de desarrollo oculto -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-viewer: #1a1816;
            --bg-surface: #24211e;
            --bg-surface-elevated: #2d2925;
            --color-text-main: #f5f2eb;
            --color-text-muted: #a69e94;
            --color-accent: #c47c5d;
            --color-accent-hover: #d98e6e;
            --font-serif: 'Playfair Display', Georgia, serif;
            --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-viewer);
            font-family: var(--font-sans);
            color: var(--color-text-main);
        }

        .viewer-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at 50% 40%, #292521 0%, #171513 100%);
            position: relative;
        }

        /* --- Header Superior --- */
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: rgba(26, 24, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 50;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            color: var(--color-text-main);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .book-identity {
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-family: var(--font-serif);
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--color-text-main);
            letter-spacing: -0.01em;
        }

        .book-subtitle {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            font-weight: 400;
        }

        .btn-buy-amazon {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #d98e6e;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.45rem 1rem;
            border-radius: 6px;
            box-shadow: 0 2px 10px rgba(196, 124, 93, 0.35);
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn-buy-amazon:hover {
            background: #e29a7c;
            transform: translateY(-1px);
        }

        /* --- Viewport Central del Libro --- */
        .viewer-viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 1.5rem 1rem;
            perspective: 2000px;
        }

        .book-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease-out;
        }

        /* Contenedor de PageFlip */
        .page-flip-container {
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.65), 0 10px 25px rgba(0, 0, 0, 0.4);
            border-radius: 4px;
        }

        /* Estilo de cada hoja */
        .page-sheet {
            background-color: #fdfbf7;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-sheet img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* Barra Inferior de Navegación */
        .viewer-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.25rem;
            background: rgba(26, 24, 22, 0.88);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            gap: 1.25rem;
            z-index: 50;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--color-text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.2rem;
            line-height: 1;
        }

        .control-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .page-counter {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-muted);
            min-width: 140px;
            text-align: center;
            user-select: none;
        }

        .tool-divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.12);
        }

        .secondary-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2px 4px;
            gap: 2px;
        }

        .zoom-btn {
            background: transparent;
            border: none;
            color: var(--color-text-main);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .zoom-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .zoom-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .zoom-level {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-muted);
            min-width: 42px;
            text-align: center;
            user-select: none;
            cursor: pointer;
            padding: 0 4px;
        }

        .keyboard-hint {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        .kbd-key {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 4px;
            padding: 1px 6px;
            font-size: 0.75rem;
            font-family: inherit;
        }

        @media (max-width: 600px) {
            .keyboard-hint, .tool-divider:last-of-type {
                display: none;
            }
            .book-subtitle {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="viewer-layout">
        <!-- Header Superior -->
        <header class="viewer-header">
            <div class="header-left">
                <button type="button" class="btn-back" onclick="handleBackAction()">
                    <span>←</span> Volver al libro
                </button>
                <div class="book-identity">
                    <span class="book-title">Afirmaciones Diarias</span>
                    <span class="book-subtitle">Muestra interactiva de las primeras 10 páginas</span>
                </div>
            </div>
            <a href="https://www.amazon.es/stores/author/B0H4DGPHR3/allbooks?ingress=0&visitId=6ddfca86-ee87-4acd-9e31-719c75c181cd&ref_=as_li_ss_tl" target="_blank" rel="noopener noreferrer" class="btn-buy-amazon">
                <span>🛒</span> Comprar en Amazon
            </a>
        </header>

        <!-- Viewport Central con PageFlip -->
        <main class="viewer-viewport">
            <div class="book-wrapper">
                <div id="book-container" class="page-flip-container">
                    
                    <!-- 1. Cubierta Frontal (Tapa dura / exterior) -->
                    <div class="page-sheet" data-density="hard">
                        <img src="/books/afirmaciones-diarias/cover_front.webp" alt="Portada de Afirmaciones Diarias" />
                    </div>

                    <!-- 2. Hoja de cortesía en blanco -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_blank.webp" alt="Página de cortesía" />
                    </div>

                    <!-- 3. Portadilla interior (p. 1) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_01.webp" alt="Página 1: Portadilla interior" />
                    </div>

                    <!-- 4. Créditos legales (p. 2) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_02.webp" alt="Página 2: Créditos y copyright" />
                    </div>

                    <!-- 5. Manifiesto Menos Ruido (p. 3) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_03.webp" alt="Página 3: Manifiesto Menos Ruido" />
                    </div>

                    <!-- 6. El antídoto al positivismo tóxico (p. 4) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_04.webp" alt="Página 4: El antídoto al positivismo tóxico" />
                    </div>

                    <!-- 7. El método diario de 5 minutos (p. 5) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_05.webp" alt="Página 5: El método diario de 5 minutos" />
                    </div>

                    <!-- 8. Matriz anual de hábitos (p. 6) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_06.webp" alt="Página 6: Matriz anual de seguimiento de 365 días" />
                    </div>

                    <!-- 9. Calibración inicial I (p. 7) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_07.webp" alt="Página 7: Calibración inicial I" />
                    </div>

                    <!-- 10. Calibración inicial II (p. 8) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_08.webp" alt="Página 8: Calibración inicial II" />
                    </div>

                    <!-- 11. Día 1: Ficha completa (p. 9) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_09.webp" alt="Página 9: Ficha completa del Día 1" />
                    </div>

                    <!-- 12. Día 2: Ficha completa (p. 10) -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_10.webp" alt="Página 10: Ficha completa del Día 2" />
                    </div>

                    <!-- 13. Reverso interior en blanco -->
                    <div class="page-sheet">
                        <img src="/books/afirmaciones-diarias/page_blank.webp" alt="Hoja final en blanco" />
                    </div>

                    <!-- 14. Contraportada (Tapa dura / exterior) -->
                    <div class="page-sheet" data-density="hard">
                        <img src="/books/afirmaciones-diarias/cover_back.webp" alt="Contraportada con código de barras" />
                    </div>

                </div>
            </div>
        </main>

        <!-- Barra Inferior de Navegación -->
        <footer class="viewer-toolbar">
            <div class="nav-controls">
                <button id="btn-prev" class="control-btn" aria-label="Página anterior" title="Página anterior (←)">
                    <span>‹</span>
                </button>
                <div id="page-indicator" class="page-counter">Cargando...</div>
                <button id="btn-next" class="control-btn" aria-label="Página siguiente" title="Página siguiente (→)">
                    <span>›</span>
                </button>
            </div>

            <div class="tool-divider"></div>

            <div class="secondary-controls">
                <div class="zoom-controls" title="Ajustar tamaño del libro">
                    <button id="btn-zoom-out" class="zoom-btn" aria-label="Reducir tamaño" title="Reducir (−)">−</button>
                    <span id="zoom-level" class="zoom-level" title="Restablecer tamaño (100%)">100%</span>
                    <button id="btn-zoom-in" class="zoom-btn" aria-label="Aumentar tamaño" title="Aumentar (+)">+</button>
                </div>
                <button id="btn-sound-toggle" class="control-btn muted" aria-label="Activar o silenciar sonido de pasar página" title="Sonido de papel al hojear">
                    <span class="sound-icon">🔇</span>
                </button>
                <button id="btn-fullscreen" class="control-btn" aria-label="Pantalla completa" title="Alternar pantalla completa">
                    <span style="font-size: 1.1rem; line-height: 1;">⛶</span>
                </button>
            </div>

            <div class="tool-divider"></div>

            <div class="keyboard-hint">
                <span>Navega con</span>
                <span class="kbd-key">←</span>
                <span class="kbd-key">→</span>
                <span>o arrastrando</span>
            </div>
        </footer>
    </div>

    <!-- Script del Visor -->
    <script>
        function handleBackAction() {
            if (window.parent && window.parent !== window && typeof window.parent.closeBookModal === 'function') {
                window.parent.closeBookModal();
            } else {
                window.location.href = '/afirmaciones-diarias.html';
            }
        }
    </script>
    <script type="module" src="./visor-afirmaciones-diarias.js"></script>
</body>
</html>
