<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D Interactivo — Habla Claro | Editorial Menos Ruido</title>
    <meta name="description" content="Hojea en 3D el cuaderno guiado 'Habla Claro' con sonido realista y páginas originales de alta resolución.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-viewer: #1a1816;
            --bg-surface: #24211e;
            --bg-surface-elevated: #2d2925;
            --color-text-main: #f5f2eb;
            --color-text-muted: #a69e94;
            --color-accent: #c47c5d;
            --color-accent-hover: #d98e6e;
            --font-serif: 'Newsreader', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-viewer);
            font-family: var(--font-sans);
            color: var(--color-text-main);
        }

        .viewer-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: radial-gradient(circle at 50% 40%, #292521 0%, #171513 100%);
            position: relative;
        }

        /* Header Superior */
        .viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1.25rem;
            background: rgba(26, 24, 22, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 50;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-back:hover {
            color: var(--color-text-main);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .book-identity {
            display: flex;
            flex-direction: column;
        }

        .book-title {
            font-family: var(--font-serif);
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--color-text-main);
            letter-spacing: -0.01em;
        }

        .book-subtitle {
            font-size: 0.75rem;
            color: var(--color-text-muted);
        }

        /* Stage Central */
        .viewer-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 1rem;
        }

        .stage-spotlight {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            height: 85%;
            max-width: 1000px;
            max-height: 800px;
            background: radial-gradient(ellipse at center, rgba(255, 240, 220, 0.05) 0%, rgba(0,0,0,0) 70%);
            pointer-events: none;
            z-index: 1;
        }

        .book-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
            transform-origin: center center;
        }

        #book-container {
            margin: auto;
            box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55), 0 4px 16px rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .page-sheet {
            background-color: #faf7f2;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.03);
        }

        .page-sheet img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
        }

        .page-sheet.--left::after {
            content: "";
            position: absolute;
            top: 0;
            right: 0;
            width: 28px;
            height: 100%;
            background: linear-gradient(to left, rgba(0,0,0,0.12), rgba(0,0,0,0));
            pointer-events: none;
        }

        .page-sheet.--right::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 28px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.12), rgba(0,0,0,0));
            pointer-events: none;
        }

        .page-sheet[data-density="hard"] {
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15);
        }

        /* Toolbar */
        .viewer-toolbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 0.85rem 1.5rem;
            background: rgba(26, 24, 22, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 50;
            flex-shrink: 0;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: var(--color-text-main);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .control-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .page-counter {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-muted);
            min-width: 140px;
            text-align: center;
            user-select: none;
        }

        .tool-divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.12);
        }

        .secondary-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 2px 4px;
            gap: 2px;
        }

        .zoom-btn {
            background: transparent;
            border: none;
            color: var(--color-text-main);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            line-height: 1;
            transition: all 0.2s ease;
        }

        .zoom-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
        }

        .zoom-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .zoom-level {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-muted);
            min-width: 42px;
            text-align: center;
            user-select: none;
            cursor: pointer;
            padding: 0 4px;
        }

        .zoom-level:hover {
            color: var(--color-text-main);
        }

        .pill-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--color-text-muted);
            padding: 0.4rem 0.85rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            color: var(--color-text-main);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .pill-btn.muted {
            opacity: 0.7;
            border-color: rgba(255, 255, 255, 0.08);
        }

        .keyboard-hint {
            font-size: 0.75rem;
            color: var(--color-text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .kbd-key {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            padding: 0.1rem 0.35rem;
            font-size: 0.7rem;
            font-family: monospace;
        }

        .book-loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-viewer);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            z-index: 100;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .book-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.12);
            border-top-color: var(--color-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .book-subtitle, .keyboard-hint, .tool-divider {
                display: none;
            }
            .viewer-header {
                padding: 0.5rem 0.85rem;
            }
            .viewer-toolbar {
                padding: 0.65rem 1rem;
                gap: 0.75rem;
            }
            .page-counter {
                min-width: 110px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="viewer-layout">
        <!-- Loader -->
        <div id="book-loader" class="book-loader">
            <div class="spinner"></div>
            <p style="font-size: 0.9rem; color: var(--color-text-muted);">Cargando páginas del cuaderno...</p>
        </div>

        <!-- Header -->
        <header class="viewer-header">
            <div class="header-left">
                <button type="button" id="btn-back-action" class="btn-back" title="Volver a la ficha del cuaderno" onclick="handleBackAction()">
                    <span>←</span> Ficha del cuaderno
                </button>
                <div class="book-identity">
                    <h1 class="book-title">Habla Claro</h1>
                    <span class="book-subtitle">Muestra interactiva • 16 páginas originales</span>
                </div>
            </div>
        </header>

        <!-- Stage Central -->
        <main class="viewer-stage">
            <div class="stage-spotlight"></div>
            <div class="book-wrapper">
                <div id="book-container">
                    <!-- 16 Páginas Renderizadas del Interior y Portada -->
                    <!-- 1. Portada -->
                    <div class="page-sheet" data-density="hard">
                        <img src="/books/habla-claro/page_01.webp" alt="Portada: Habla Claro" />
                    </div>
                    <!-- 2. Página 0 (Reverso en blanco de la portada) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_02.webp" alt="Página 0: Reverso de portada" />
                    </div>
                    <!-- 3. Portadilla (Interior p. 1) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_03.webp" alt="Portadilla: Habla Claro" />
                    </div>
                    <!-- 4. Créditos (Interior p. 2) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_04.webp" alt="Créditos editoriales y datos de edición" />
                    </div>
                    <!-- 5. Manifiesto Editorial (Interior p. 3) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_05.webp" alt="Manifiesto: Menos Ruido, Más Claridad" />
                    </div>
                    <!-- 6. Sumario (Interior p. 4) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_06.webp" alt="Sumario: Estructura del Cuaderno" />
                    </div>
                    <!-- 7. Metodología: El Marco de 4 Pasos (Interior p. 5) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_07.webp" alt="Metodología: El Marco de 4 Pasos" />
                    </div>
                    <!-- 8. Sección I: 15 Fichas Prácticas (Interior p. 12) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_08.webp" alt="Sección I: 15 Fichas Prácticas" />
                    </div>
                    <!-- 9. Instrucciones de uso (Interior p. 13) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_09.webp" alt="Instrucciones de uso: Guía operativa" />
                    </div>
                    <!-- 10. Ficha Paso 1: Descarga y Clarificación (Interior p. 14) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_10.webp" alt="Ficha Paso 1: Descarga y Clarificación" />
                    </div>
                    <!-- 11. Ficha Paso 2: Objetivos y Límites Duros (Interior p. 15) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_11.webp" alt="Ficha Paso 2: Objetivos y Límites Duros" />
                    </div>
                    <!-- 12. Ficha Paso 3: El Guion Mínimo (Interior p. 16) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_12.webp" alt="Ficha Paso 3: El Guion Mínimo" />
                    </div>
                    <!-- 13. Ficha Paso 4: Anticipación y Desescalada (Interior p. 17) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_13.webp" alt="Ficha Paso 4: Anticipación y Desescalada" />
                    </div>
                    <!-- 14. Agradecimientos (Interior p. 126) -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_14.webp" alt="Agradecimientos: Gracias por llegar hasta aquí" />
                    </div>
                    <!-- 15. Reverso en blanco de la contraportada -->
                    <div class="page-sheet">
                        <img src="/books/habla-claro/page_15.webp" alt="Reverso interior de contraportada" />
                    </div>
                    <!-- 16. Contraportada con código de barras Amazon KDP -->
                    <div class="page-sheet" data-density="hard">
                        <img src="/books/habla-claro/page_16.webp" alt="Contraportada con código de barras KDP" />
                    </div>
                </div>
            </div>
        </main>

        <!-- Barra Inferior de Navegación -->
        <footer class="viewer-toolbar">
            <div class="nav-controls">
                <button id="btn-prev" class="control-btn" aria-label="Página anterior" title="Página anterior (←)">
                    <span>‹</span>
                </button>
                <div id="page-indicator" class="page-counter">Cargando...</div>
                <button id="btn-next" class="control-btn" aria-label="Página siguiente" title="Página siguiente (→)">
                    <span>›</span>
                </button>
            </div>

            <div class="tool-divider"></div>

            <div class="secondary-controls">
                <div class="zoom-controls" title="Ajustar tamaño del libro">
                    <button id="btn-zoom-out" class="zoom-btn" aria-label="Reducir tamaño" title="Reducir (−)">−</button>
                    <span id="zoom-level" class="zoom-level" title="Restablecer tamaño (100%)">100%</span>
                    <button id="btn-zoom-in" class="zoom-btn" aria-label="Aumentar tamaño" title="Aumentar (+)">+</button>
                </div>
                <button id="btn-sound-toggle" class="pill-btn muted" aria-label="Activar o silenciar sonido de pasar página" title="Sonido de papel al hojear">
                    <span class="sound-icon">🔇</span>
                    <span class="sound-text">Activar sonido</span>
                </button>
                <button id="btn-fullscreen" class="pill-btn" aria-label="Pantalla completa" title="Alternar pantalla completa">
                    <span>⛶</span>
                    <span>Pantalla completa</span>
                </button>
            </div>

            <div class="tool-divider"></div>

            <div class="keyboard-hint">
                <span>Navega con</span>
                <span class="kbd-key">←</span>
                <span class="kbd-key">→</span>
                <span>o arrastrando</span>
            </div>
        </footer>
    </div>

    <!-- Script del Visor -->
    <script>
        function handleBackAction() {
            if (window.parent && window.parent !== window && typeof window.parent.closeBookModal === 'function') {
                window.parent.closeBookModal();
            } else {
                window.location.href = '/habla-claro.html';
            }
        }
    </script>
    <script type="module" src="./visor-habla.js"></script>
</body>
</html>
