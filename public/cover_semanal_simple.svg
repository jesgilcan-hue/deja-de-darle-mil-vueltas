<svg xmlns="http://www.w3.org/2000/svg" width="1223.512" height="450" viewBox="0 0 1223.512" style="background-color: #ffffff;">
      <rect x="0" y="0" width="1223.512" height="450" fill="#1f2421" stroke="none" stroke-width="1" />
<text x="609.236" y="142.258" font-family="Arial, Helvetica, sans-serif" font-size="7.2" font-weight="bold" font-style="normal" fill="#f5f0e6" transform="rotate(-270 609.236 142.258)">MENOS RUIDO  •  PLANIFICADOR ATEMPORAL</text>
<text x="665.512" y="69" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="bold" font-style="normal" fill="#f5f0e6">MENOS RUIDO</text>
<text x="665.512" y="109" font-family="Georgia, serif" font-size="38" font-weight="normal" font-style="normal" fill="#f5f0e6">Planificador</text>
<text x="665.512" y="147" font-family="Georgia, serif" font-size="38" font-weight="normal" font-style="normal" fill="#f5f0e6">Atemporal</text>
<text x="665.512" y="172" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" font-style="normal" fill="#d98a6c">SEMANAL Y MENSUAL CON HABIT TRACKER</text>
<text x="665.512" y="202" font-family="Georgia, serif" font-size="14" font-weight="normal" font-style="normal" fill="#e2e7e1">Metas, Proyectos y Acción.</text>
<text x="665.512" y="235" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" font-style="normal" fill="#a0b0a8">Saca las ideas de la cabeza. Estructura tus meses, diseña tus hábitos y organiza tus semanas con claridad y</text>
<text x="665.512" y="249.5" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" font-style="normal" fill="#a0b0a8">enfoque. Menos pantalla, más enfoque.</text>
<text x="665.512" y="371" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="bold" font-style="normal" fill="#f5f0e6">MENOS RUIDO</text>
<text x="665.512" y="385" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="#a0b0a8">La calma de tener tu tiempo bajo control.</text>
<text x="665.512" y="399" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" font-style="italic" fill="#a0b0a8">Un cuaderno de escritura para pensar en papel.</text>
<text x="54" y="69" font-family="Arial, Helvetica, sans-serif" font-size="9.2" font-weight="bold" font-style="normal" fill="#f5f0e6">MENOS RUIDO</text>
<text x="54" y="114" font-family="Georgia, serif" font-size="28" font-weight="normal" font-style="normal" fill="#f5f0e6">Pensar en Papel</text>
<text x="54" y="139" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#a0b0a8">Este planificador te invita a recuperar la concentración. Sin notificaciones, sin batería, sin</text>
<text x="54" y="154" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="normal" font-style="normal" fill="#a0b0a8">distracciones. Solo tus prioridades puestas por escrito con claridad y sencillez.</text>
<text x="54" y="194" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">Estructura del planificador (108 páginas):</text>
<text x="54" y="212" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Planificador anual</text>
<text x="54" y="226" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Planificador mensual atemporal (12 meses completos)</text>
<text x="54" y="240" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Registro y seguimiento de hábitos (Habit Tracker)</text>
<text x="54" y="254" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Definición de metas trimestrales</text>
<text x="54" y="268" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Definición de proyectos trimestrales</text>
<text x="54" y="282" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Planificador semanal de doble página (53 semanas)</text>
<text x="54" y="296" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Sección de notas libres con malla de puntos</text>
<rect x="441" y="336.6" width="144" height="86.4" fill="#ffffff" stroke="rgb(51, 51, 51)" stroke-width="0.5" />
    </svg>