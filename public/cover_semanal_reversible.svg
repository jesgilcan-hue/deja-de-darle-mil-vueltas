<text x="665.512" y="169" font-family="Georgia, serif" font-size="14" font-weight="normal" font-style="normal" fill="rgb(38, 38, 38)">Metas, Proyectos y Hábitos.</text>
<text x="665.512" y="202" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" font-style="normal" fill="rgb(77, 77, 77)">Saca las ideas de la cabeza. Estructura tus meses, diseña tus hábitos y recupera el control de tu tiempo.</text>
<text x="665.512" y="216.5" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" font-style="normal" fill="rgb(77, 77, 77)">Menos pantalla, más enfoque. Diseñado para usarse durante todo un año, independientemente del mes en el que</text>
<text x="665.512" y="231" font-family="Arial, Helvetica, sans-serif" font-size="9.8" font-weight="normal" font-style="normal" fill="rgb(77, 77, 77)">empieces.</text>
<text x="665.512" y="371" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="bold" font-style="normal" fill="rgb(64, 64, 64)">MENOS RUIDO</text>
<text x="665.512" y="385" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" font-style="normal" fill="rgb(77, 77, 77)">Para ti, o para regalar a quien busca planificarse</text>
<text x="665.512" y="399" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="normal" font-style="italic" fill="rgb(77, 77, 77)">Un cuaderno de escritura para regalarse menos ruido</text>
