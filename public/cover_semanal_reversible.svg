<text x="54" y="230" font-family="Georgia, serif" font-size="14" font-weight="normal" font-style="normal" fill="#e2e7e1">Organización y Acción.</text>
<text x="54" y="263" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">Estructura del planificador (108 páginas):</text>
<text x="54" y="281" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Planificador anual</text>
<text x="54" y="295" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Planificador mensual atemporal (12 meses completos)</text>
<text x="54" y="309" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Registro y seguimiento de hábitos (Habit Tracker)</text>
<text x="54" y="323" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Definición de metas trimestrales</text>
<text x="54" y="337" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Definición de proyectos trimestrales</text>
<text x="54" y="351" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Planificador semanal de doble página (53 semanas)</text>
<text x="54" y="365" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="normal" font-style="normal" fill="#a0b0a8">• Sección de notas libres con malla de puntos</text>
